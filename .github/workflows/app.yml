name: App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      REAL_OSS_SMOKE: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Confirm Xcode toolchain
        run: xcodebuild -version

      - name: Resolve pinned packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Ossuno.xcodeproj \
            -scheme Ossuno \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates
          git diff --exit-code -- Ossuno.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Run Apple Silicon tests
        run: |
          xcodebuild \
            -project Ossuno.xcodeproj \
            -scheme Ossuno \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            test

      - name: Run Intel tests with Rosetta
        run: |
          xcodebuild \
            -project Ossuno.xcodeproj \
            -scheme Ossuno \
            -configuration Debug \
            -destination 'platform=macOS,arch=x86_64' \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            test

      - name: Run ossuno-mcp tests
        working-directory: Tools/ossuno-mcp
        run: swift test --disable-sandbox -Xswiftc -warnings-as-errors

      - name: Build Universal Release
        run: |
          universal_derived_data="$RUNNER_TEMP/Ossuno-universal"
          xcodebuild \
            -project Ossuno.xcodeproj \
            -scheme Ossuno \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$universal_derived_data" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            build

          app_executable="$universal_derived_data/Build/Products/Release/Ossuno.app/Contents/MacOS/Ossuno"
          app_info="$universal_derived_data/Build/Products/Release/Ossuno.app/Contents/Info.plist"
          version_info="$(scripts/project-version.sh)"
          expected_version="${version_info%% *}"
          expected_build="${version_info##* }"
          lipo "$app_executable" -verify_arch arm64 x86_64
          test "$(lipo -archs "$app_executable")" = "x86_64 arm64" || \
            test "$(lipo -archs "$app_executable")" = "arm64 x86_64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_info")" = "$expected_version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_info")" = "$expected_build"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_info")" = "app.ihopeful.Ossuno"

      - name: Analyze
        run: |
          xcodebuild \
            -project Ossuno.xcodeproj \
            -scheme Ossuno \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            analyze

      - name: Validate repository metadata
        run: |
          scripts/validate-website.sh
          bash -n scripts/*.sh
          zsh -n scripts/*.sh
          plutil -lint Info.plist Ossuno/PrivacyInfo.xcprivacy
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |file| YAML.load_file(file, aliases: true) }'
